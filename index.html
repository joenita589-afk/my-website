<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripley's Believe It or Not! Pattaya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Language Selector -->
    <div class="language-selector">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="th">🇹🇭 ไทย</option>
            <option value="en">🇬🇧 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="he">🇮🇱 עברית</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="ar">🇸🇦 العربية</option>
        </select>
    </div>

    <!-- Navigation Menu -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-link active"><i class="fas fa-home"></i> หน้าหลัก</a>
            <a href="coupon.html" class="nav-link"><i class="fas fa-ticket-alt"></i> คูปอง</a>
            <a href="menu.html" class="nav-link"><i class="fas fa-utensils"></i> เมนู</a>
            <a href="contact.html" class="nav-link"><i class="fas fa-map-marker-alt"></i> ติดต่อเรา</a>
            <a href="login.html" class="nav-link admin-btn"><i class="fas fa-lock"></i> Admin</a>
        </div>
    </nav>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>Ripley's Believe It or Not! Pattaya</h1>
            <p class="tagline" data-key="tagline">ความมหัศจรรย์ที่คุณต้องเชื่อ!</p>
        </div>
    </header>

    <!-- Attractions Grid -->
    <main class="container">
        <section id="attractions" class="attractions-grid">
            <!-- เนื้อหาจะถูกโหลดโดย JavaScript จากไฟล์ languages.js -->
            <p style="text-align: center; color: white; grid-column: 1/-1;">กำลังโหลดข้อมูล...</p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Ripley's Believe It or Not! Pattaya. All Rights Reserved.</p>
            <p>เว็บไซต์นี้พัฒนาเพื่อรองรับผู้ใช้งานจำนวนมากผ่าน Cloudflare Pages</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/languages.js"></script>
</body>
</html>
