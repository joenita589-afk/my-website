<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ripley's Pattaya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .login-box .form-group {
            margin-bottom: 20px;
        }
        .login-box label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #3498db;
        }
        .login-box .btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            margin-top: 10px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #3498db;
            text-decoration: none;
        }
        .error-message {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1><i class="fas fa-lock"></i> Admin Login</h1>
            <div class="error-message" id="errorMessage">
                รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-key"></i> รหัสผ่าน Admin</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" onkeypress="handleKeyPress(event)">
            </div>
            <button class="btn btn-primary" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
            </button>
            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
            </div>
        </div>
    </div>

    <script>
        // รหัสผ่าน Admin (ควรเก็บไว้ในที่ปลอดภัยกว่านี้ใน Production)
        const ADMIN_PASSWORD = 'ripleys2024';

        function login() {
            const password = document.getElementById('password').value;
            
            if (password === ADMIN_PASSWORD) {
                // บันทึกสถานะ Login
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('loginTime', new Date().toISOString());
                
                // ไปหน้า Admin
                window.location.href = 'admin.html';
            } else {
                // แสดงข้อความผิดพลาด
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('password').value = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        // ตรวจสอบว่า Login อยู่แล้วหรือยัง
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('adminLoggedIn');
            if (isLoggedIn === 'true') {
                // ถามว่าจะไปหน้า Admin เลยไหม
                if (confirm('คุณได้เข้าสู่ระบบแล้ว ต้องการไปหน้า Admin เลยหรือไม่?')) {
                    window.location.href = 'admin.html';
                }
            }
        });
    </script>
</body>
</html>
