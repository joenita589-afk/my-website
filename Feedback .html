<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripley's Believe It or Not! Pattaya - แสดงความคิดเห็น</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root { --primary: #e94560; --secondary: #ffd700; --dark: #1a1a2e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%); min-height:100vh; color:#333; line-height:1.6; padding:30px 15px; }
    .top-bar { display:flex; justify-content:flex-end; max-width:640px; margin:0 auto 15px; }
    .lang-select select { padding:8px 14px; border-radius:25px; border:2px solid var(--primary); background:#fff; color:var(--dark); font-size:14px; font-weight:600; cursor:pointer; }
    .hero { text-align:center; padding:10px 10px 25px; color:#fff; max-width:640px; margin:0 auto; }
    .hero h1 { font-size:2em; color:var(--primary); text-shadow:2px 2px 10px rgba(0,0,0,0.5); margin-bottom:8px; }
    .hero p { font-size:1.1em; color:var(--secondary); }
    .info-box { max-width:640px; margin:0 auto; background:#fff; border-radius:15px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
    .fb-field-label { font-size:0.95em; color:var(--dark); font-weight:600; margin-bottom:8px; }
    .fb-req { color:var(--primary); }
    .fb-optional { color:#999; font-weight:normal; }
    .fb-cat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:6px; }
    .fb-cat { border:0.5px solid #ddd; border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer; transition:0.2s; }
    .fb-cat:hover { border-color:var(--primary); }
    .fb-cat i { font-size:1.3em; color:#888; }
    .fb-cat div { font-size:0.85em; color:#555; margin-top:6px; }
    .fb-cat.active { border:2px solid var(--primary); background:#fbeaf0; }
    .fb-cat.active i, .fb-cat.active div { color:#993556; font-weight:600; }
    .fb-subselect { background:#fbeaf0; border-radius:10px; padding:14px; margin:14px 0; }
    .fb-subselect-label { font-size:0.9em; color:#993556; font-weight:600; margin-bottom:8px; }
    .fb-stars { display:flex; align-items:center; gap:6px; margin-bottom:20px; }
    .fb-stars i { font-size:1.6em; color:#f39c12; cursor:pointer; }
    .fb-stars i.far { color:#ddd; }
    .fb-rating-word { font-size:0.85em; color:#888; margin-left:8px; }
    .fb-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
    .fb-input { width:100%; padding:10px 12px; border:2px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; font-family:inherit; }
    .fb-input:focus { outline:none; border-color:var(--primary); }
    textarea.fb-input { min-height:100px; resize:vertical; }
    .fb-error { color:#e74c3c; font-size:0.85em; min-height:1.2em; margin-top:4px; }
    .fb-charcount { text-align:right; font-size:0.8em; color:#999; margin-top:4px; }
    .fb-submit { width:100%; margin-top:10px; font-size:1.05em; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; transition:0.3s; }
    .fb-submit:hover:not(:disabled) { background:#c0392b; }
    .fb-submit:disabled { background:#bbb; cursor:not-allowed; }
    .fb-note { text-align:center; font-size:0.85em; color:#888; margin-top:10px; }
    .fb-success { text-align:center; padding:30px 10px; }
    .fb-success i { font-size:3em; color:#27ae60; margin-bottom:14px; }
    .fb-success h3 { color:var(--dark); margin-bottom:8px; }
    @media (max-width:600px) { .fb-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="top-bar">
    <div class="lang-select">
        <select id="langSelect" onchange="changeLang(this.value)">
            <option value="th">🇹🇭 ไทย</option>
            <option value="en">🇬🇧 English</option>
        </select>
    </div>
</div>

<div class="hero">
    <h1 data-i18n="feedback_title">แสดงความคิดเห็น</h1>
    <p data-i18n="feedback_sub">ช่วยเราปรับปรุงประสบการณ์ของคุณ</p>
</div>

<div class="info-box">
    <div id="feedbackFormWrap"></div>
</div>

<script>
/* ============ ตั้งค่าก่อนใช้งานจริง ============ */
const WEB3FORMS_ACCESS_KEY = 'ใส่ ACCESS_KEY จาก web3forms.com ตรงนี้';
const ADMIN_NOTIFY_EMAIL   = 'ใส่อีเมลแอดมินที่จะรับแจ้งเตือนตรงนี้';
/* ================================================ */

const translations = {
    th: {
        feedback_title: "แสดงความคิดเห็น",
        feedback_sub: "ช่วยเราปรับปรุงประสบการณ์ของคุณ",
        feedback_category_label: "เรื่องที่ต้องการแสดงความเห็นเกี่ยวกับ",
        feedback_cat_rides: "เครื่องเล่น",
        feedback_cat_staff: "พนักงาน",
        feedback_cat_food: "อาหาร/เครื่องดื่ม",
        feedback_cat_ticket: "การขายบัตร/คิว",
        feedback_cat_cleanliness: "ความสะอาด/สถานที่",
        feedback_cat_other: "อื่นๆ",
        feedback_select_ride: "เลือกเครื่องเล่นที่เกี่ยวข้อง",
        feedback_select_ride_placeholder: "เลือกเครื่องเล่น",
        feedback_select_food: "เลือกเมนูที่เกี่ยวข้อง",
        feedback_select_food_placeholder: "เลือกเมนู",
        feedback_rating_label: "ให้คะแนนความพึงพอใจ",
        feedback_rating_1: "แย่มาก", feedback_rating_2: "แย่", feedback_rating_3: "พอใช้",
        feedback_rating_4: "ดี", feedback_rating_5: "ดีเยี่ยม",
        feedback_optional: "ไม่บังคับ",
        feedback_name_label: "ชื่อ",
        feedback_name_placeholder: "ชื่อของคุณ",
        feedback_phone_label: "เบอร์โทร",
        feedback_visit_date_label: "วันที่มาเที่ยว",
        feedback_email_label: "อีเมล",
        feedback_email_placeholder: "name@email.com",
        feedback_detail_label: "รายละเอียดความคิดเห็น",
        feedback_detail_placeholder: "บอกเราว่าคุณประทับใจ หรืออยากให้ปรับปรุงอะไร",
        feedback_submit_btn: "ส่งความคิดเห็น",
        feedback_sending: "กำลังส่ง...",
        feedback_submit_note: "ทีมงานจะได้รับอีเมลแจ้งเตือนทันทีที่คุณส่งความคิดเห็น",
        feedback_error_required: "กรุณากรอกข้อมูลให้ครบก่อนส่ง",
        feedback_error_email: "กรุณากรอกอีเมลให้ถูกต้อง",
        feedback_success_title: "ขอบคุณสำหรับความคิดเห็น!",
        feedback_success_desc: "ทีมงานได้รับข้อความของคุณแล้ว และจะติดต่อกลับหากจำเป็น",
        feedback_error_send: "ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง"
    },
    en: {
        feedback_title: "Share Your Feedback",
        feedback_sub: "Help us improve your experience",
        feedback_category_label: "What would you like to give feedback about",
        feedback_cat_rides: "Attractions",
        feedback_cat_staff: "Staff",
        feedback_cat_food: "Food/Beverages",
        feedback_cat_ticket: "Ticketing/Queue",
        feedback_cat_cleanliness: "Cleanliness/Venue",
        feedback_cat_other: "Other",
        feedback_select_ride: "Select the related attraction",
        feedback_select_ride_placeholder: "Select attraction",
        feedback_select_food: "Select the related menu item",
        feedback_select_food_placeholder: "Select item",
        feedback_rating_label: "Rate your satisfaction",
        feedback_rating_1: "Very poor", feedback_rating_2: "Poor", feedback_rating_3: "Average",
        feedback_rating_4: "Good", feedback_rating_5: "Excellent",
        feedback_optional: "optional",
        feedback_name_label: "Name",
        feedback_name_placeholder: "Your name",
        feedback_phone_label: "Phone",
        feedback_visit_date_label: "Visit date",
        feedback_email_label: "Email",
        feedback_email_placeholder: "name@email.com",
        feedback_detail_label: "Feedback details",
        feedback_detail_placeholder: "Tell us what you loved or what we can improve",
        feedback_submit_btn: "Submit Feedback",
        feedback_sending: "Sending...",
        feedback_submit_note: "Our team will receive an email notification as soon as you submit",
        feedback_error_required: "Please fill in all required fields",
        feedback_error_email: "Please enter a valid email address",
        feedback_success_title: "Thank you for your feedback!",
        feedback_success_desc: "Our team has received your message and will follow up if needed.",
        feedback_error_send: "Failed to send. Please try again."
    }
};

// รายชื่อเครื่องเล่น/เมนู อ้างอิงจากหน้าเว็บหลัก ใช้สำหรับดรอปดาวน์ย่อยเท่านั้น
const RIDE_NAMES = {
    th: ["พิพิธภัณฑ์ เชื่อหรือไม่!","สวนสนุกสุดสยอง (Scream in the Dark)","โกดังผีสิง","พิพิธภัณฑ์หุ่นขี้ผึ้ง หลุยส์ ทุสโซด์ส","มหัศจรรย์เขาวงกต","เกมส์ตะลุยเลเซอร์","โรงพยาบาลหลอน","พีระมิดที่สาบสูญ","เกมอินเตอร์แอคทีฟสุดล้ำ","หนีตายสวนสยอง"],
    en: ["Believe It or Not! Museum","Scream in the Dark","Haunted Warehouse","Louis Tussaud's Waxworks","Infinity Maze","Laser Mission","The Horror Hospital","Lost Pyramid","Interactive Games","Escape the Haunted Garden"]
};
const MENU_NAMES = {
    th: ["ไส้กรอก 3 ชิ้น","ข้าวเกรียบ SB","ป๊อปคอร์น","เฟรนช์ฟรายส์","สติ๊กไก่ทอด","ไก่ป๊อป","ของทานเล่นทอดรวม","น้ำดื่ม","น้ำอัดลม","SLUSHY"],
    en: ["Sausage (3 pcs)","SB Rod Snack Classic","Popcorn","French Fries","Chicken Sticks","Crispy Chicken Pop","Mixed Fried Snacks","Drinking Water","Soft Drinks","Slushy"]
};

const FEEDBACK_CATEGORIES = [
    { id: 'rides', icon: 'fa-rocket', key: 'feedback_cat_rides' },
    { id: 'staff', icon: 'fa-user-tie', key: 'feedback_cat_staff' },
    { id: 'food', icon: 'fa-utensils', key: 'feedback_cat_food' },
    { id: 'ticket', icon: 'fa-ticket-alt', key: 'feedback_cat_ticket' },
    { id: 'cleanliness', icon: 'fa-broom', key: 'feedback_cat_cleanliness' },
    { id: 'other', icon: 'fa-ellipsis-h', key: 'feedback_cat_other' }
];

let currentLang = localStorage.getItem('ripleysFeedbackLang') || 'th';
let feedbackState = { category: null, subItem: '', rating: 0 };

function changeLang(lang) {
    currentLang = lang;
    localStorage.setItem('ripleysFeedbackLang', lang);
    document.getElementById('langSelect').value = lang;
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerHTML = t[key];
    });
    renderFeedbackForm();
}

function renderFeedbackForm() {
    const t = translations[currentLang];
    const wrap = document.getElementById('feedbackFormWrap');

    const catChips = FEEDBACK_CATEGORIES.map(c => `
        <div class="fb-cat ${feedbackState.category === c.id ? 'active' : ''}" onclick="selectFeedbackCategory('${c.id}')">
            <i class="fas ${c.icon}"></i>
            <div>${t[c.key]}</div>
        </div>
    `).join('');

    let subSelectHtml = '';
    if (feedbackState.category === 'rides') {
        const rides = RIDE_NAMES[currentLang];
        subSelectHtml = `
            <div class="fb-subselect">
                <div class="fb-subselect-label"><i class="fas fa-arrow-down"></i> ${t.feedback_select_ride}</div>
                <select class="fb-input" onchange="feedbackState.subItem = this.value">
                    <option value="">-- ${t.feedback_select_ride_placeholder} --</option>
                    ${rides.map(r => `<option value="${r}" ${feedbackState.subItem === r ? 'selected' : ''}>${r}</option>`).join('')}
                </select>
            </div>`;
    } else if (feedbackState.category === 'food') {
        const items = MENU_NAMES[currentLang];
        subSelectHtml = `
            <div class="fb-subselect">
                <div class="fb-subselect-label"><i class="fas fa-arrow-down"></i> ${t.feedback_select_food}</div>
                <select class="fb-input" onchange="feedbackState.subItem = this.value">
                    <option value="">-- ${t.feedback_select_food_placeholder} --</option>
                    ${items.map(m => `<option value="${m}" ${feedbackState.subItem === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
            </div>`;
    }

    const ratingWordKeys = ['feedback_rating_1','feedback_rating_2','feedback_rating_3','feedback_rating_4','feedback_rating_5'];
    const ratingWord = feedbackState.rating ? t[ratingWordKeys[feedbackState.rating - 1]] : '';
    const stars = [1,2,3,4,5].map(n => `<i class="fa${n <= feedbackState.rating ? 's' : 'r'} fa-star" onclick="selectFeedbackRating(${n})"></i>`).join('');

    // เก็บค่าที่ผู้ใช้กรอกไว้แล้ว (ถ้ามี) เพื่อไม่ให้หายตอน re-render จากการเลือกหมวด/ดาว
    const prevName = document.getElementById('fbName') ? document.getElementById('fbName').value : '';
    const prevPhone = document.getElementById('fbPhone') ? document.getElementById('fbPhone').value : '';
    const prevDate = document.getElementById('fbVisitDate') ? document.getElementById('fbVisitDate').value : '';
    const prevEmail = document.getElementById('fbEmail') ? document.getElementById('fbEmail').value : '';
    const prevDetail = document.getElementById('fbDetail') ? document.getElementById('fbDetail').value : '';

    wrap.innerHTML = `
        <div class="fb-field-label">${t.feedback_category_label} <span class="fb-req">*</span></div>
        <div class="fb-cat-grid">${catChips}</div>
        ${subSelectHtml}

        <div class="fb-field-label" style="margin-top:20px;">${t.feedback_rating_label} <span class="fb-req">*</span></div>
        <div class="fb-stars">${stars}<span class="fb-rating-word">${feedbackState.rating ? `${feedbackState.rating} / 5 — ${ratingWord}` : ''}</span></div>

        <div class="fb-row">
            <div>
                <div class="fb-field-label">${t.feedback_name_label} <span class="fb-optional">(${t.feedback_optional})</span></div>
                <input type="text" class="fb-input" id="fbName" placeholder="${t.feedback_name_placeholder}" value="${prevName.replace(/"/g,'&quot;')}">
            </div>
            <div>
                <div class="fb-field-label">${t.feedback_phone_label} <span class="fb-optional">(${t.feedback_optional})</span></div>
                <input type="tel" class="fb-input" id="fbPhone" placeholder="08x-xxx-xxxx" value="${prevPhone.replace(/"/g,'&quot;')}">
            </div>
        </div>

        <div class="fb-row">
            <div>
                <div class="fb-field-label">${t.feedback_visit_date_label} <span class="fb-optional">(${t.feedback_optional})</span></div>
                <input type="date" class="fb-input" id="fbVisitDate" max="${new Date().toISOString().split('T')[0]}" value="${prevDate}">
            </div>
            <div>
                <div class="fb-field-label">${t.feedback_email_label} <span class="fb-req">*</span></div>
                <input type="email" class="fb-input" id="fbEmail" placeholder="${t.feedback_email_placeholder}" value="${prevEmail.replace(/"/g,'&quot;')}">
            </div>
        </div>
        <div class="fb-error" id="fbEmailError"></div>

        <div class="fb-field-label" style="margin-top:14px;">${t.feedback_detail_label} <span class="fb-req">*</span></div>
        <textarea class="fb-input" id="fbDetail" maxlength="500" placeholder="${t.feedback_detail_placeholder}" oninput="document.getElementById('fbCharCount').textContent = this.value.length">${prevDetail}</textarea>
        <div class="fb-charcount"><span id="fbCharCount">${prevDetail.length}</span> / 500</div>
        <div class="fb-error" id="fbDetailError"></div>
        <div class="fb-error" id="fbCatError"></div>

        <button class="fb-submit" id="fbSubmitBtn" onclick="submitFeedback()"><i class="fas fa-paper-plane"></i> ${t.feedback_submit_btn}</button>
        <div class="fb-note">${t.feedback_submit_note}</div>
        <div id="fbResult"></div>
    `;
}

function selectFeedbackCategory(id) {
    feedbackState.category = id;
    feedbackState.subItem = '';
    renderFeedbackForm();
}

function selectFeedbackRating(n) {
    feedbackState.rating = n;
    renderFeedbackForm();
}

async function submitFeedback() {
    const t = translations[currentLang];
    let ok = true;

    document.getElementById('fbEmailError').textContent = '';
    document.getElementById('fbDetailError').textContent = '';
    document.getElementById('fbCatError').textContent = '';

    const email = document.getElementById('fbEmail').value.trim();
    const detail = document.getElementById('fbDetail').value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!feedbackState.category || !feedbackState.rating) {
        document.getElementById('fbCatError').textContent = t.feedback_error_required;
        ok = false;
    }
    if (!email || !emailPattern.test(email)) {
        document.getElementById('fbEmailError').textContent = t.feedback_error_email;
        ok = false;
    }
    if (!detail) {
        document.getElementById('fbDetailError').textContent = t.feedback_error_required;
        ok = false;
    }
    if (!ok) return;

    const btn = document.getElementById('fbSubmitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t.feedback_sending;

    const catLabel = t[FEEDBACK_CATEGORIES.find(c => c.id === feedbackState.category).key];

    const payload = {
        access_key: WEB3FORMS_ACCESS_KEY,
        subject: `[Ripley's Feedback] ${catLabel}${feedbackState.subItem ? ' - ' + feedbackState.subItem : ''}`,
        from_name: "Ripley's Pattaya Website",
        to: ADMIN_NOTIFY_EMAIL,
        category: catLabel,
        related_item: feedbackState.subItem || '-',
        rating: `${feedbackState.rating} / 5`,
        name: document.getElementById('fbName').value.trim() || '-',
        phone: document.getElementById('fbPhone').value.trim() || '-',
        visit_date: document.getElementById('fbVisitDate').value || '-',
        email: email,
        message: detail
    };

    try {
        const res = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('feedbackFormWrap').innerHTML = `
                <div class="fb-success">
                    <i class="fas fa-check-circle"></i>
                    <h3>${t.feedback_success_title}</h3>
                    <p>${t.feedback_success_desc}</p>
                </div>`;
        } else {
            throw new Error(data.message || 'send failed');
        }
    } catch (err) {
        document.getElementById('fbResult').innerHTML = `<div class="fb-error" style="text-align:center;margin-top:10px;">${t.feedback_error_send}</div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> ' + t.feedback_submit_btn;
    }
}

window.onload = () => { changeLang(currentLang); };
</script>
</body>
</html>
